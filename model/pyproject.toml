[project.optional-dependencies]
cu130 = [
  "torch==2.12.0+cu130",
  "torchvision==0.27.0+cu130",
  "transformer-engine-cu13==2.16.0",
  "transformer-engine-torch==2.16.0",
  "transformer-engine==2.16.0",
  "triton==3.7.0",
]

[tool.uv]
# transformer-engine-torch is sdist-only; build it against the env's torch + TE-cu13 libs.
no-build-isolation-package = ["transformer-engine-torch"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# torch pins cuBLAS to 13.1.x, but TE 2.16 needs grouped-GEMM symbols only present in 13.5+.
override-dependencies = ["nvidia-cublas==13.5.1.27"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.sdist]
packages = ["cosmos_predict2", "imaginaire"]

[tool.hatch.build.targets.wheel]
packages = ["cosmos_predict2", "imaginaire"]
exclude = ["*_test.py"]
